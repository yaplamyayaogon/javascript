<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RunningHub - Download & Decode Existing Task</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root {
            --primary: #00d2ff;
            --secondary: #3a7bd5;
            --bg: #0f0c29;
            --card-bg: rgba(255, 255, 255, 0.05);
            --text: #ffffff;
            --error: #ff4b2b;
            --success: #00f260;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 650px;
            padding: 40px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.02em;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.9rem;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.6);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px 14px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: white;
            font-size: 0.95rem;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(0, 210, 255, 0.1);
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            color: white;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            margin-top: 20px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -10px rgba(0, 210, 255, 0.5);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .status-panel {
            margin-top: 30px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 16px;
            display: none;
            text-align: left;
        }

        .step {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.5);
        }

        .step.active { color: var(--primary); font-weight: 500; }
        .step.completed { color: var(--success); }
        .step.failed { color: var(--error); }

        .step-icon {
            width: 18px;
            height: 18px;
            margin-right: 12px;
            border: 2px solid currentColor;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.65rem;
            flex-shrink: 0;
        }

        #result-container {
            margin-top: 30px;
            display: none;
        }

        .log-trigger {
            margin-top: 20px;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.3);
            cursor: pointer;
            text-decoration: underline;
        }

        #console-log {
            display: none;
            margin-top: 15px;
            padding: 10px;
            background: #000;
            color: #0f0;
            font-family: 'Courier New', monospace;
            font-size: 0.75rem;
            border-radius: 8px;
            max-height: 200px;
            overflow-y: auto;
            text-align: left;
        }

        /* Player styles */
        .player-wrap {
            margin-top: 20px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 15px;
        }
        .canvas-wrap {
            width: 100%;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            aspect-ratio: 16/9;
            margin-bottom: 15px;
        }
        .canvas-wrap canvas {
            max-width: 100%;
            max-height: 100%;
            display: block;
        }
        .scrubber-wrap {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }
        .scrubber {
            flex: 1;
            -webkit-appearance: none;
            height: 4px;
            border-radius: 99px;
            background: rgba(255,255,255,0.1);
            outline: none;
            cursor: pointer;
        }
        .scrubber::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--primary);
            cursor: pointer;
            box-shadow: 0 0 0 3px rgba(0, 210, 255, 0.2);
        }
        .frame-counter {
            font-family: monospace;
            font-size: 0.8rem;
            color: rgba(255,255,255,0.6);
            min-width: 60px;
            text-align: right;
        }
        .ctrl-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        .ctrl-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            color: white;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.15s;
        }
        .ctrl-btn:hover:not(:disabled) {
            border-color: var(--primary);
            color: var(--primary);
        }
        .ctrl-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        .ctrl-btn.play-btn {
            width: 44px;
            height: 44px;
            font-size: 1.2rem;
            border-radius: 50%;
        }

        /* Progress styles */
        .progress-wrap {
            margin-top: 15px;
            text-align: left;
        }
        .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            margin-bottom: 5px;
            color: rgba(255,255,255,0.6);
        }
        .progress-bar {
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 99px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            border-radius: 99px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            transition: width 0.15s ease;
        }
        .progress-fill.green {
            background: linear-gradient(90deg, #00f260, #059669);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Download & Decode Task</h1>
    <p class="subtitle">Download already generated frames from <a href="https://www.runninghub.ai/?inviteCode=qlbtubgi" target="_blank" style="color: var(--primary);">RunningHub</a> and decode watermark</p>

    <div class="input-group">
        <label for="api-key"><a href="https://www.runninghub.ai/enterprise-api/consumerApi?inviteCode=qlbtubgi" target="_blank" style="color: inherit; text-decoration: underline;">RunningHub</a> API Key</label>
        <input type="text" id="api-key" placeholder="Enter your 32-bit API Key...">
        <div style="margin-top: 5px; text-align: left;">
            <a href="https://www.runninghub.ai/enterprise-api/consumerApi?inviteCode=qlbtubgi" target="_blank" style="font-size: 0.75rem; color: var(--primary); text-decoration: none;">Get your API Key here</a>
        </div>
    </div>

    <div class="input-group">
        <label for="task-id">Task ID (from previous generation)</label>
        <input type="text" id="task-id" placeholder="e.g., 2068413266178297857">
    </div>

    <button id="start-btn" disabled>Download & Decode</button>

    <div class="status-panel" id="status-panel">
        <div class="step" id="step-query">
            <div class="step-icon">1</div> Querying task status...
        </div>
        <div class="step" id="step-download">
            <div class="step-icon">2</div> Downloading frames...
        </div>
        <div class="step" id="step-decode">
            <div class="step-icon">3</div> Decoding frames...
        </div>
    </div>

    <div id="result-container">
        <h3>Result Ready (Decoded)</h3>
        
        <div class="player-wrap">
            <div class="canvas-wrap">
                <canvas id="previewCanvas"></canvas>
            </div>
            
            <div class="scrubber-wrap">
                <input type="range" class="scrubber" id="scrubber" min="0" value="0" step="1" disabled />
                <span class="frame-counter" id="frameCounter">0 / 0</span>
            </div>
            
            <div class="ctrl-row">
                <button class="ctrl-btn" id="btnFirst" disabled title="First Frame">⏮</button>
                <button class="ctrl-btn" id="btnPrev" disabled title="Prev Frame">◀</button>
                <button class="ctrl-btn play-btn" id="btnPlay" disabled title="Play / Pause">▶</button>
                <button class="ctrl-btn" id="btnNext" disabled title="Next Frame">▶</button>
                <button class="ctrl-btn" id="btnLast" disabled title="Last Frame">⏭</button>
            </div>
        </div>

        <div class="progress-wrap">
            <div class="progress-label">
                <span>WebM Compile Progress</span>
                <span id="expPct">—</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill green" id="expFill"></div>
            </div>
        </div>

        <button class="btn btn-green" id="btnExport" style="margin-top:15px; width:100%; display:flex; align-items:center; justify-content:center; gap:8px;" disabled>
            <span>⬇</span> Download WebM Video
        </button>
    </div>

    <div class="log-trigger" onclick="toggleLog()">Technical Log</div>
    <div id="console-log"></div>
</div>

<script>
    // Config
    const FPS = 16;
    const FRAME_MS = 1000 / FPS;

    // UI Elements
    const apiKeyInput = document.getElementById('api-key');
    const taskIdInput = document.getElementById('task-id');
    const startBtn = document.getElementById('start-btn');
    const statusPanel = document.getElementById('status-panel');
    const resultContainer = document.getElementById('result-container');
    const consoleLog = document.getElementById('console-log');

    // Player Elements
    const previewCanvas = document.getElementById('previewCanvas');
    const ctx = previewCanvas.getContext('2d');
    const scrubber = document.getElementById('scrubber');
    const frameCounter = document.getElementById('frameCounter');
    const btnFirst = document.getElementById('btnFirst');
    const btnPrev = document.getElementById('btnPrev');
    const btnPlay = document.getElementById('btnPlay');
    const btnNext = document.getElementById('btnNext');
    const btnLast = document.getElementById('btnLast');
    
    // Export Elements
    const btnExport = document.getElementById('btnExport');
    const expFill = document.getElementById('expFill');
    const expPct = document.getElementById('expPct');

    let decodedFrames = [];
    let currentFrame = 0;
    let isPlaying = false;
    let playTimer = null;
    let isRecording = false;

    // Load API Key from localStorage
    const savedKey = localStorage.getItem('rh_api_key');
    if (savedKey) apiKeyInput.value = savedKey;

    // Save API Key on change
    apiKeyInput.oninput = () => {
        localStorage.setItem('rh_api_key', apiKeyInput.value);
        validateInputs();
    };

    taskIdInput.oninput = validateInputs;

    function validateInputs() {
        startBtn.disabled = !(apiKeyInput.value.length >= 30 && taskIdInput.value.trim().length > 0);
    }

    function log(msg, type = 'info') {
        const time = new Date().toLocaleTimeString();
        const entry = document.createElement('div');
        entry.style.color = type === 'error' ? '#ff4b2b' : (type === 'success' ? '#00f260' : '#0f0');
        entry.innerText = `[${time}] ${msg}`;
        consoleLog.appendChild(entry);
        consoleLog.scrollTop = consoleLog.scrollHeight;
    }

    function toggleLog() {
        consoleLog.style.display = consoleLog.style.display === 'block' ? 'none' : 'block';
    }

    function setStep(id, status) {
        const el = document.getElementById(id);
        el.className = `step ${status}`;
        if (status === 'active') el.querySelector('.step-icon').innerText = '●';
        if (status === 'completed') el.querySelector('.step-icon').innerText = '✓';
        if (status === 'failed') el.querySelector('.step-icon').innerText = '✕';
    }

    // Main execution
    startBtn.onclick = async () => {
        const apiKey = apiKeyInput.value.trim();
        const taskId = taskIdInput.value.trim();
        
        startBtn.disabled = true;
        statusPanel.style.display = 'block';
        resultContainer.style.display = 'none';
        
        try {
            // Step 1: Query task
            setStep('step-query', 'active');
            log("Querying task status...");
            
            const queryResponse = await fetch('https://www.runninghub.ai/openapi/v2/query', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${apiKey}`
                },
                body: JSON.stringify({ taskId: taskId })
            });
            
            const data = await queryResponse.json();
            
            if (!queryResponse.ok) {
                throw new Error(`Query failed: ${data.errorMessage || 'Unknown error'}`);
            }
            
            if (data.status !== 'SUCCESS') {
                throw new Error(`Task status is ${data.status}, not SUCCESS. Wait for completion.`);
            }
            
            log(`Task status: SUCCESS`, 'success');
            log(`Results: ${data.results.length} files`, 'success');
            
            // Выводим первые 3 и последний URL полностью для отладки
            for (let i = 0; i < Math.min(3, data.results.length); i++) {
                log(`Result[${i}]: ${data.results[i].url}`, 'info');
            }
            if (data.results.length > 3) {
                log(`Result[${data.results.length - 1}]: ${data.results[data.results.length - 1].url}`, 'info');
            }
            
            setStep('step-query', 'completed');

            // Разделяем по nodeId: 422 = watermark, 421 = кадры
            const wmResult = data.results.find(r => r.nodeId === '422');
            const shotResults = data.results.filter(r => r.nodeId === '421');
            
            log(`Found by nodeId: ${shotResults.length} shots (nodeId=421) + ${wmResult ? '1 watermark (nodeId=422)' : 'NO WATERMARK'}`, 'success');
            
            // Альтернатива: если nodeId другие, ищем по первому элементу (watermark) и остальным (кадры)
            if (!wmResult || shotResults.length === 0) {
                log('nodeId method failed, trying index-based detection...', 'info');
                // Первый файл = watermark, остальные = кадры
                const wmByIndex = data.results[0];
                const shotsByIndex = data.results.slice(1);
                log(`Index-based: ${shotsByIndex.length} shots + 1 watermark`, 'info');
                
                // Используем этот метод
                shotResults.push(...shotsByIndex);
                if (!wmResult) {
                    data.results.unshift(wmByIndex);
                }
            }
            
            if (shotResults.length === 0) {
                throw new Error('No shot frames found in results. Check task ID.');
            }
            
            if (!wmResult) {
                throw new Error('No watermark found in results. Cannot decode without watermark.');
            }

            // Кадры уже отсортированы сервером по порядку в массиве
            log(`Starting download of ${shotResults.length} frames...`, 'info');

            // Step 2: Download frames
            setStep('step-download', 'active');
            const shotBlobs = [];
            const total = shotResults.length;
            
            for (let i = 0; i < total; i += 10) {
                const batch = shotResults.slice(i, Math.min(i + 10, total));
                const batchPromises = batch.map(async (r) => {
                    const res = await fetch(r.url);
                    return await res.blob();
                });
                const batchBlobs = await Promise.all(batchPromises);
                shotBlobs.push(...batchBlobs);
                
                const pct = Math.min(100, Math.round(((i + 10) / total) * 100));
                log(`Downloaded ${Math.min(i + 10, total)}/${total} frames (${pct}%)`);
            }
            
            log(`All ${shotResults.length} frames downloaded`, 'success');
            
            // Download watermark
            log("Downloading watermark...");
            const wmRes = await fetch(wmResult.url);
            const wmBlob = await wmRes.blob();
            
            setStep('step-download', 'completed');

            // Step 3: Decode
            setStep('step-decode', 'active');
            log("Decoding frames on CPU...");
            
            await decodeAll(shotBlobs, wmBlob);
            
        } catch (err) {
            log(err.message, 'error');
            setStep('step-query', 'failed');
            startBtn.disabled = false;
        }
    };

    // Load Image Blob to ImageData
    async function loadImageData(blob, targetW, targetH) {
        const opts = { colorSpaceConversion: 'none', imageOrientation: 'none' };
        if (targetW && targetH) {
            opts.resizeWidth = targetW;
            opts.resizeHeight = targetH;
            opts.resizeQuality = 'high';
        }
        const bitmap = await createImageBitmap(blob, opts);
        const w = bitmap.width;
        const h = bitmap.height;
        const oc = new OffscreenCanvas(w, h);
        const ox = oc.getContext('2d', { willReadFrequently: true, alpha: false, colorSpace: 'srgb' });
        ox.drawImage(bitmap, 0, 0);
        bitmap.close();
        return { data: ox.getImageData(0, 0, w, h), w, h };
    }

    async function decodeAll(shotBlobs, wmBlob) {
        try {
            decodedFrames = [];
            
            const firstShot = await loadImageData(shotBlobs[0]);
            const { w, h } = firstShot;
            log(`Frame size: ${w}x${h}`);

            const wm = await loadImageData(wmBlob, w, h);
            const wmPix = wm.data.data;

            previewCanvas.width = w;
            previewCanvas.height = h;

            for (let i = 0; i < shotBlobs.length; i++) {
                const res = i === 0 ? firstShot : await loadImageData(shotBlobs[i]);
                const sp = res.data.data;

                // Decode formula: a = Math.round(2 * shot - watermark)
                for (let p = 0; p < sp.length; p += 4) {
                    sp[p]   = Math.min(255, Math.max(0, Math.round(2.0 * sp[p]   - wmPix[p])));
                    sp[p+1] = Math.min(255, Math.max(0, Math.round(2.0 * sp[p+1] - wmPix[p+1])));
                    sp[p+2] = Math.min(255, Math.max(0, Math.round(2.0 * sp[p+2] - wmPix[p+2])));
                    sp[p+3] = 255;
                }

                decodedFrames.push(res.data);
                if (i % 5 === 0) ctx.putImageData(res.data, 0, 0);
            }

            log("Decoding completed!", 'success');
            setStep('step-decode', 'completed');
            
            showFrame(0);
            initPlayer();
            resultContainer.style.display = 'block';

        } catch (err) {
            log("Decoding error: " + err.message, 'error');
            setStep('step-decode', 'failed');
        } finally {
            startBtn.disabled = false;
        }
    }

    // Player logic
    function initPlayer() {
        const n = decodedFrames.length;
        scrubber.max = n - 1;
        scrubber.value = 0;
        scrubber.disabled = false;
        btnExport.disabled = false;
        updateCounter(0);
        setPlayerBtns(true);
    }

    function setPlayerBtns(on) {
        [btnPlay, btnFirst, btnPrev, btnNext, btnLast].forEach(b => b.disabled = !on);
    }

    function showFrame(idx) {
        if (!decodedFrames.length) return;
        idx = Math.max(0, Math.min(idx, decodedFrames.length - 1));
        currentFrame = idx;
        scrubber.value = idx;
        ctx.putImageData(decodedFrames[idx], 0, 0);
        updateCounter(idx);
    }

    function updateCounter(idx) {
        frameCounter.textContent = `${idx + 1} / ${decodedFrames.length}`;
    }

    btnPlay.onclick = () => isPlaying ? stopPlay() : startPlay();
    btnFirst.onclick = () => { stopPlay(); showFrame(0); };
    btnLast.onclick = () => { stopPlay(); showFrame(decodedFrames.length - 1); };
    btnPrev.onclick = () => { stopPlay(); showFrame(currentFrame - 1); };
    btnNext.onclick = () => { stopPlay(); showFrame(currentFrame + 1); };
    scrubber.oninput = (e) => { stopPlay(); showFrame(parseInt(e.target.value, 10)); };

    function startPlay() {
        isPlaying = true;
        btnPlay.textContent = '⏸';
        scheduleNext();
    }

    function stopPlay() {
        isPlaying = false;
        btnPlay.textContent = '▶';
        if (playTimer) clearTimeout(playTimer);
    }

    function scheduleNext() {
        if (!isPlaying) return;
        showFrame((currentFrame + 1) % decodedFrames.length);
        playTimer = setTimeout(scheduleNext, FRAME_MS);
    }

    // Compile WebM Video
    btnExport.onclick = async () => {
        if (!decodedFrames.length || isRecording) return;
        isRecording = true;
        btnExport.disabled = true;
        expFill.style.width = '0%';
        expPct.textContent = '0%';

        log("Compiling WebM video stream...", 'info');

        const w = previewCanvas.width;
        const h = previewCanvas.height;
        const recCanvas = document.createElement('canvas');
        recCanvas.width = w;
        recCanvas.height = h;
        const recCtx = recCanvas.getContext('2d');

        // Выбираем поддерживаемый кодек
        let mimeType = 'video/webm;codecs=vp8';
        if (MediaRecorder.isTypeSupported('video/webm;codecs=vp9')) {
            mimeType = 'video/webm;codecs=vp9';
            log('Using VP9 codec', 'info');
        } else if (MediaRecorder.isTypeSupported('video/webm;codecs=vp8')) {
            mimeType = 'video/webm;codecs=vp8';
            log('Using VP8 codec', 'info');
        } else if (MediaRecorder.isTypeSupported('video/webm')) {
            mimeType = 'video/webm';
            log('Using default WebM codec', 'info');
        } else {
            throw new Error('No supported video codec found. Try Chrome or Firefox.');
        }
        
        const stream = recCanvas.captureStream(FPS);
        const recorder = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: 8000000 });
        const chunks = [];
        
        let dataAvailableCount = 0;
        let lastDataTime = 0;

        recorder.ondataavailable = e => { 
            if (e.data.size > 0) {
                chunks.push(e.data);
                dataAvailableCount++;
                lastDataTime = Date.now();
                log(`Data chunk ${dataAvailableCount}: ${e.data.size} bytes`, 'info');
            }
        };
        
        const done = new Promise((resolve, reject) => {
            const timeout = setTimeout(() => {
                log('Recording timeout - forcing stop', 'error');
                recorder.stop();
                reject(new Error('Recording timeout after 30 seconds'));
            }, 30000);
            
            recorder.onstop = () => {
                clearTimeout(timeout);
                log(`Recording stopped. Total chunks: ${chunks.length}`, 'success');
                
                if (chunks.length === 0) {
                    reject(new Error('No video data recorded'));
                    return;
                }
                
                const blob = new Blob(chunks, { type: mimeType });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `rh_decoded_${Date.now()}.webm`;
                a.click();
                URL.revokeObjectURL(url);
                log("Video saved!", 'success');
                isRecording = false;
                btnExport.disabled = false;
                expPct.textContent = '100%';
                resolve();
            };
            
            recorder.onerror = (e) => {
                log('Recorder error: ' + JSON.stringify(e), 'error');
                reject(new Error('MediaRecorder error'));
            };
        });

        log(`Starting recording: ${decodedFrames.length} frames at ${FPS} FPS`, 'info');
        recorder.start();

        const total = decodedFrames.length;
        for (let i = 0; i < total; i++) {
            recCtx.putImageData(decodedFrames[i], 0, 0);
            await new Promise(r => setTimeout(r, FRAME_MS));
            const pct = Math.round(((i + 1) / total) * 100);
            expFill.style.width = pct + '%';
            expPct.textContent = pct + '%';
            
            // Лог каждые 25%
            if (i === Math.floor(total * 0.25) || i === Math.floor(total * 0.5) || i === Math.floor(total * 0.75)) {
                log(`Encoding progress: ${pct}%`, 'info');
            }
        }
        
        log('All frames rendered, stopping recorder...', 'info');
        recorder.stop();
        await done;
    };
</script>
